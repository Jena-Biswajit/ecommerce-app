spring.application.name=catalog-services

# ========================
# Database Connection
# ========================
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Biswajit@408
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================
# Flyway Config
# ========================
# Enable Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Ensure Flyway can start even if schema already exists
spring.flyway.baseline-on-migrate=true

# Validate applied migrations against available migration scripts
spring.flyway.validate-on-migrate=true

# Workaround for MySQL 8.4 unsupported issue
spring.flyway.url=jdbc:mysql://localhost:3306/ecommerce_db?useMysqlMetadata=true&useSSL=false&allowPublicKeyRetrieval=true
spring.flyway.user=root
spring.flyway.password=Biswajit@408
spring.flyway.driver-class-name=com.mysql.cj.jdbc.Driver

# Disable Spring's automatic schema initialization
spring.sql.init.mode=never

